name: studiozai
description: Studio ZAI - auto clip, subtitle & voiceover studio (Android, on-device)
publish_to: none
version: 1.10.0+15

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  device_info_plus: ^13.2.0
  http: ^1.6.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  flutter_secure_storage: ^11.2.0
  record: ^7.1.1
  archive: ^3.6.1
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  # Putar hasil pratinjau di dalam app (editor timeline).
  video_player: ^2.9.2
  # Media & speech (all on-device)
  ffmpeg_kit_flutter_new: ^4.6.2
  sherpa_onnx: ^1.13.8
  # Video sources: direct URLs via http, YouTube via pure Dart (no native code).
  # TikTok/Instagram downloads run through yt-dlp on the desktop app instead —
  # the Android yt-dlp plugins are not yet compatible with AGP 9 / Gradle 9.
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/fonts/
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
