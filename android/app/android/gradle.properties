org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Jangan tinggalkan daemon JVM (java.exe "OpenJDK Platform binary") yang terus
# berjalan setelah build APK selesai; build sedikit lebih lambat tapi bersih.
org.gradle.daemon=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
