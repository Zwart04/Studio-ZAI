[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiozai"
version = "1.16.0"
description = "Studio ZAI - cross-platform auto clip, subtitle and voiceover studio (local-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-StudioZAI-Noncommercial" }
authors = [{ name = "Zwart04" }]
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
media = ["yt-dlp[default]>=2026.8.19", "youtube-transcript-api>=1.2.0", "requests>=2.31"]
asr = ["faster-whisper>=1.1.0"]
tts = ["piper-tts>=1.2.0", "sherpa-onnx==1.13.8"]
clone = ["chatterbox-tts", "torch", "torchaudio", "safetensors", "huggingface_hub"]
face = ["opencv-python-headless>=4.10,<5"]
translation = ["ctranslate2>=4", "sentencepiece>=0.2", "sacremoses>=0.1", "subword-nmt>=0.3"]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
  "opencv-python-headless>=4.10,<5",
  "sentencepiece>=0.2", "sacremoses>=0.1", "subword-nmt>=0.3",
  "yt-dlp[default]>=2026.8.19",
  "youtube-transcript-api>=1.2.0",
  "requests>=2.31",
  "faster-whisper>=1.1.0",
  "piper-tts>=1.2.0",
  "sherpa-onnx==1.13.8",
]

[project.scripts]
studiozai = "studiozai.cli:main"

[tool.setuptools]
packages = ["studiozai", "studiozai.pipeline", "studiozai.models", "studiozai.utils"]

[tool.setuptools.package-data]
"studiozai.models" = ["registry.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Basetemp lokal: folder temp sistem (%TEMP%\pytest-*) bisa punya ACL rusak
# akibat sesi yang mati paksa, yang membuat seluruh tes error PermissionError.
addopts = "--basetemp=.tmp-pytest"
