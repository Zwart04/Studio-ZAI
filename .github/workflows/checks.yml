name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e 'core[dev,media,asr,tts,face,translation]' httpx pillow
      - run: python -m ruff check core/studiozai
      - run: python scripts/check_version.py
      - run: python tools/check_i18n.py
      - run: python tools/audit_release_privacy.py
      - run: python -m pytest core/tests -q
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
